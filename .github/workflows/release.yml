name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # release notes are built from the log between tags

      # Without the certificate the DMG is signed ad-hoc, whose identity is the
      # binary hash — so every update looks like a different app and users must
      # re-grant Accessibility. Importing it keeps that grant across updates.
      #
      # Runs unconditionally and reports what it did: a skipped step reads as a
      # clean run, which hid a missing secret across two releases.
      - name: Import signing certificate
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "${CERT_P12:-}" ]; then
            echo "::warning::SIGNING_CERT_P12 is not set — the DMG will be ad-hoc signed."
            echo "Updates will reset users' Accessibility permission."
            exit 0
          fi
          keychain=build.keychain
          password="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import /tmp/cert.p12 -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          rm -f /tmp/cert.p12
          echo "Imported signing certificate."

      # The version lives in ./VERSION; refuse to publish a tag that disagrees
      # with it, so the DMG name can never contradict the binary inside.
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "Tag $tag does not match VERSION $file" >&2
            exit 1
          fi

      - name: Build DMG
        run: ./package.sh

      # package.sh prints which identity it used; make a silent fallback fatal
      # when the certificate was supposed to be there.
      - name: Confirm the DMG is signed with the certificate
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          app="build/dmg/LangSwitcher.app"
          requirement="$(codesign -d -r- "$app" 2>&1 | grep designated || true)"
          echo "$requirement"
          if [ -n "${CERT_P12:-}" ] && echo "$requirement" | grep -q cdhash; then
            echo "::error::Certificate was provided but the app is ad-hoc signed."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="build/LangSwitcher-$version.dmg"

          # What actually changed, rather than the same blurb every time.
          previous="$(git describe --tags --abbrev=0 "v$version^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            git log --no-merges --pretty=format:'- %s' "$previous..v$version" \
              | grep -v '^- Bump version' > changes.txt || true
          else
            : > changes.txt
          fi

          # Install steps live in the README; repeating them every release just
          # buries what people came to read.
          {
            echo "**What changed**"
            echo
            if [ -s changes.txt ]; then cat changes.txt; else echo "- Maintenance release"; fi
          } > notes.md
          rm -f changes.txt

          # Re-runnable: create the release the first time, refresh the asset
          # and notes on later runs rather than failing because it exists.
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$dmg" --clobber
            gh release edit "v$version" --title "LangSwitcher $version" --notes-file notes.md
          else
            gh release create "v$version" "$dmg" \
              --title "LangSwitcher $version" \
              --notes-file notes.md
          fi
