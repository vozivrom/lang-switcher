name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
    steps:
      - uses: actions/checkout@v5

      # Without the certificate the DMG is signed ad-hoc, whose identity is the
      # binary hash — so every update looks like a different app and users must
      # re-grant Accessibility. Importing it keeps that grant across updates.
      - name: Import signing certificate
        if: env.CERT_P12 != ''
        env:
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          keychain=build.keychain
          password="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$password" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -t 3600 -u "$keychain"
          security import /tmp/cert.p12 -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          rm -f /tmp/cert.p12

      # The version lives in ./VERSION; refuse to publish a tag that disagrees
      # with it, so the DMG name can never contradict the binary inside.
      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "Tag $tag does not match VERSION $file" >&2
            exit 1
          fi

      - name: Build DMG
        run: ./package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          dmg="build/LangSwitcher-$version.dmg"
          sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"

          cat > notes.md <<EOF
          Requires macOS 13 or later on Apple Silicon.

          **Install**

          1. Open the DMG and drag LangSwitcher to Applications.
          2. Launch it. macOS will say it cannot verify the developer, because
             the app isn't notarized. Click Done, then open
             System Settings > Privacy & Security and click **Open Anyway**.
          3. Enable LangSwitcher under Privacy & Security > **Accessibility**.

          **Usage**

          Type a word in the wrong layout and double-tap Shift. Press again to
          cycle to the next layout. Choose your layouts, the trigger key and
          per-app layout memory from the globe icon in the menu bar.

          SHA256: \`$sha\`
          EOF

          # Re-runnable: create the release the first time, refresh the asset
          # and notes on later runs rather than failing because it exists.
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release upload "v$version" "$dmg" --clobber
            gh release edit "v$version" --title "LangSwitcher $version" --notes-file notes.md
          else
            gh release create "v$version" "$dmg" \
              --title "LangSwitcher $version" \
              --notes-file notes.md
          fi
