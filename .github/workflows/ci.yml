name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: ./Tests/run.sh

      - name: Build
        run: ./build.sh

      - name: Package DMG
        run: ./package.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: LangSwitcher-dmg
          path: build/*.dmg
          if-no-files-found: error
